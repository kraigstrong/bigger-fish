name: CI

on:
  pull_request:
  # Nothing runs on a push to main: a pull request already tested its merge into main. Nightly, or by hand from
  # the Actions tab, main runs every test with coverage, which catches two pull requests that pass alone but
  # break together, and Bigger Fish re-plans every Shallow Reef spec, where a pull request checks a sample
  # (MeetingPlannerTests).
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which apps to test. A pull request tests only the app it changes; the project tests both apps; FishKit, CI,
  # or any file this doesn't know tests everything; and notes, docs, art sources, scripts, and App Store listing
  # text aren't built, so they test nothing. The nightly run tests everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Pick the jobs to run
        id: pick
        run: |
          math_reef=false bigger_fish=false fishkit=false
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              # A pull request is checked out merged into its base, so the merge's first parent is the base.
              changed=$(git diff --name-only HEAD^1 HEAD)
              while IFS= read -r file; do
                case "$file" in
                  "") ;;
                  MathReef/*|MathReefTests/*|MathReef.storekit|MathReef-Info.plist) math_reef=true ;;
                  BiggerFish.xcodeproj/xcshareddata/xcschemes/MathReef.xcscheme) math_reef=true ;;
                  BiggerFish/*|BiggerFishTests/*|BiggerFish.storekit|BiggerFish-Info.plist) bigger_fish=true ;;
                  BiggerFish.xcodeproj/xcshareddata/xcschemes/BiggerFish.xcscheme) bigger_fish=true ;;
                  # StoreCaptureTests checks the script captures the game's moments.
                  scripts/bigger-fish-store-capture.sh) bigger_fish=true ;;
                  # FishKit's own tests don't build from the project.
                  BiggerFish.xcodeproj/*) math_reef=true bigger_fish=true ;;
                  *.md|docs/*|Art/*|scripts/*|appstore/*|LICENSE|.gitignore) ;;
                  *) math_reef=true bigger_fish=true fishkit=true ;;
                esac
              done <<< "$changed"
              ;;
            *) math_reef=true bigger_fish=true fishkit=true ;;
          esac
          jobs=()
          if $math_reef; then
            jobs+=('{"name": "Math Reef", "dir": ".", "target": "-project BiggerFish.xcodeproj -scheme MathReef"}')
          fi
          if $bigger_fish; then
            jobs+=('{"name": "Bigger Fish", "dir": ".", "target": "-project BiggerFish.xcodeproj -scheme BiggerFish"}')
          fi
          if $fishkit; then
            jobs+=('{"name": "FishKit", "dir": "Packages/FishKit", "target": "-scheme FishKit"}')
          fi
          # PROBE: each job on both iPhones side by side, so runner load hits both alike.
          paired=()
          for job in "${jobs[@]}"; do
            for device in "iPhone Duo" "iPhone 17"; do
              paired+=("${job%\}}, \"device\": \"$device\"}")
            done
          done
          jobs=("${paired[@]}")
          matrix="[$(IFS=,; echo "${jobs[*]}")]"
          echo "matrix=$matrix" | tee -a "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.name }} on ${{ matrix.device }}
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    # GitHub's Xcode 27 image (a preview in October 2026): macos-26 stops at Xcode 26.6. Its newest simulator
    # runtime, iOS 27.1, has only the iPhone Duo, so that's the iPhone the tests run on.
    runs-on: xcode-27
    # The nightly run's Debug build, coverage, and every Shallow Reef spec take longer.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      # A pull request tests an optimized build: the planner's tests run about 3.5 times as fast, the build
      # takes only seconds longer, and no app code uses assert(), which -O drops. The nightly run tests the
      # Debug build as Xcode builds it, and measures coverage, which slows the tests.
      OPTIMIZATION: ${{ github.event_name == 'pull_request' && '-O' || '-Onone' }}
      COVERAGE: ${{ github.event_name != 'pull_request' && 'YES' || 'NO' }}
      # xcodebuild passes TEST_RUNNER_ variables to the tests without the prefix.
      TEST_RUNNER_BIGGER_FISH_FULL_PLANNER_TESTS: ${{ github.event_name != 'pull_request' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode (.xcode-version)
        run: |
          sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"
          xcodebuild -version

      - name: Pick an iPhone simulator
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          id=$(python3 - "$RUNNER_TEMP/devices.json" <<'EOF'
          import json, os, re, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          def version(runtime):
              return [int(n) for n in re.findall(r"\d+", runtime.split("iOS")[-1])]
          ios = sorted((r for r in devices if "iOS" in r), key=version, reverse=True)
          # PROBE (draft, don't merge): iOS 27.0's iPhone 17 or iOS 27.1's iPhone Duo, to time start-up.
          def match(r, d):
              if os.environ["DEVICE"] == "iPhone 17":
                  return d["name"] == "iPhone 17" and version(r)[:2] == [27, 0]
              return d["name"].startswith("iPhone")
          print(next(d["udid"] for r in ios for d in devices[r] if match(r, d)))
          EOF
          )
          xcrun simctl list devices | grep "$id"
          echo "SIMULATOR_ID=$id" >> "$GITHUB_ENV"

      # Warnings fail the build. Xcode builds the FishKit dependency with warnings suppressed, which conflicts
      # with treating them as errors, so CI turns that off too: FishKit is held to the same standard.
      - name: Test
        working-directory: ${{ matrix.dir }}
        run: |
          xcodebuild test ${{ matrix.target }} \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=arm64" \
            -enableCodeCoverage "$COVERAGE" \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            -quiet \
            SWIFT_OPTIMIZATION_LEVEL="$OPTIMIZATION" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            SWIFT_SUPPRESS_WARNINGS=NO

      - name: Coverage summary
        if: always() && env.COVERAGE == 'YES'
        run: |
          [ -d "$RUNNER_TEMP/tests.xcresult" ] || exit 0
          xcrun xccov view --report --json "$RUNNER_TEMP/tests.xcresult" > "$RUNNER_TEMP/coverage.json"
          python3 - "$RUNNER_TEMP/coverage.json" "${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          report = json.load(open(sys.argv[1]))
          print(f"### {sys.argv[2]} coverage\n")
          print("| Target | File | Lines covered |")
          print("|---|---|---|")
          for target in report["targets"]:
              if "Tests" in target["name"]:
                  continue
              name, total = target["name"], target["lineCoverage"]
              print(f"| **{name}** | | **{total:.0%}** |")
              for f in sorted(target["files"], key=lambda f: f["name"]):
                  file, pct, covered, lines = f["name"], f["lineCoverage"], f["coveredLines"], f["executableLines"]
                  print(f"| | {file} | {pct:.0%} ({covered}/{lines}) |")
          EOF

      - name: Upload test results
        # PROBE: always upload, to read the start-up timings.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }} on ${{ matrix.device }} test results
          path: ${{ runner.temp }}/tests.xcresult
